<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Skill Wheel ToE CZ</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#player {
    width: 100vw;
    height: 100vh;
}

ruffle-player {
    width: 100%;
    height: 100%;
}

/* Překryv panelu */
#sheetOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 9998;
}

/* Spodní panel */
#skillSheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 38vh;
    min-height: 260px;
    max-height: 520px;
    background: #151515;
    color: white;
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.55);
    transform: translateY(105%);
    transition: transform 0.28s ease;
    z-index: 9999;
    display: flex;
    flex-direction: column;
}

#skillSheet.open {
    transform: translateY(0);
}

#sheetOverlay.open {
    opacity: 1;
    pointer-events: auto;
}

#sheetHandle {
    width: 58px;
    height: 5px;
    border-radius: 999px;
    background: #777;
    margin: 10px auto 6px auto;
}

#sheetHeader {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 18px 12px 18px;
}

#skillIcon {
    width: 54px;
    height: 54px;
    border-radius: 10px;
    background: #333;
    flex: 0 0 auto;
}

#skillTitleWrap {
    flex: 1;
}

#skillTitle {
    font-size: 24px;
    font-weight: bold;
    margin: 0;
}

#skillSubtitle {
    font-size: 14px;
    opacity: 0.7;
    margin-top: 4px;
}

#closeSheet {
    border: 0;
    background: transparent;
    color: white;
    font-size: 30px;
    padding: 6px 10px;
}

#sheetContent {
    overflow-y: auto;
    padding: 0 20px 22px 20px;
    line-height: 1.45;
    font-size: 16px;
}

.sectionTitle {
    margin-top: 16px;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 17px;
}

.testButton {
    position: fixed;
    right: 14px;
    top: 14px;
    z-index: 10000;
    padding: 10px 14px;
    border-radius: 12px;
    border: 0;
    font-weight: bold;
}
</style>

<script>
window.RufflePlayer = window.RufflePlayer || {};

window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    splashScreen: false,
    preloader: true,
    contextMenu: "off",
    showSwfDownload: false,
    scale: "showAll",
    forceScale: true,
    letterbox: "fullscreen",
    allowFullscreen: true,
    warnOnUnsupportedContent: false,
    logLevel: "error"
};
</script>

<script src="ruffle.js"></script>
</head>

<body>

<div id="player"></div>

<button class="testButton" onclick="showSkill('logistics')">
    TEST PANEL
</button>

<div id="sheetOverlay" onclick="closeSkillSheet()"></div>

<div id="skillSheet">
    <div id="sheetHandle"></div>

    <div id="sheetHeader">
        <div id="skillIcon"></div>

        <div id="skillTitleWrap">
            <div id="skillTitle">Logistika</div>
            <div id="skillSubtitle">Hlavní skill</div>
        </div>

        <button id="closeSheet" onclick="closeSkillSheet()">×</button>
    </div>

    <div id="sheetContent">
        <div>
            Zvyšuje pohyb hrdiny po mapě dobrodružství.
        </div>

        <div class="sectionTitle">Úrovně</div>
        <div>Basic: +10 % pohybu</div>
        <div>Advanced: +20 % pohybu</div>
        <div>Expert: +30 % pohybu</div>

        <div class="sectionTitle">Požadavky</div>
        <div>Žádné</div>

        <div class="sectionTitle">Odemyká</div>
        <div>Pathfinding, Scouting, Navigation</div>
    </div>
</div>

<script>
let skillsData = {};

async function loadSkillsData() {
    try {
        const response = await fetch("data/skills_cs.json");
        skillsData = await response.json();
    } catch (e) {
        console.error("Nepodařilo se načíst databázi skillů:", e);
    }
}

function showSkill(skillId) {
    const skill = skillsData[skillId];

    if (!skill) {
        alert("Skill nebyl nalezen: " + skillId);
        return;
    }

    document.getElementById("skillTitle").textContent = skill.name;
    document.getElementById("skillSubtitle").textContent = skill.type;

    document.getElementById("sheetContent").innerHTML = `
        <div>${skill.description}</div>

        <div class="sectionTitle">Úrovně</div>
        ${skill.levels.map(x => `<div>${x}</div>`).join("")}

        <div class="sectionTitle">Požadavky</div>
        ${skill.requires.map(x => `<div>${x}</div>`).join("")}

        <div class="sectionTitle">Odemyká</div>
        ${skill.unlocks.map(x => `<div>${x}</div>`).join("")}
    `;

    openSkillSheet();
}
      function openSkillSheet() {
    document.getElementById("skillSheet").classList.add("open");
    document.getElementById("sheetOverlay").classList.add("open");
}

function closeSkillSheet() {
    document.getElementById("skillSheet").classList.remove("open");
    document.getElementById("sheetOverlay").classList.remove("open");
}

window.addEventListener("load", async () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    document.getElementById("player").appendChild(player);

    try {
        await player.ruffle().load({
            url: "skillwheel3.swf",
            autoplay: "on"
        });
    } catch (e) {
        document.body.innerHTML =
            '<div style="color:white;font:18px sans-serif;padding:24px">' +
            'Skill Wheel se nepodařilo spustit.<br><br>' +
            String(e) +
            '</div>';
    }
});
</script>

</body>
</html>
